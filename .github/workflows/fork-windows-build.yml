# Fork (cutting workspace): a Windows build of the app on every push to main, published as the
# pre-release "windows-latest" (replaced by each build). Owner's request, 2026-11-06: "I want a
# release binary to be built when I push to main ... Windows only". Unsigned: the signing keys
# are upstream's secrets. Runs only in ktand/vectorcraft; upstream's own workflows are unchanged.
name: Windows build (fork)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-windows-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows:
    if: github.repository == 'ktand/vectorcraft'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: "1.95"
      - name: Build
        run: cargo build --release --locked -p vectorcraft
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/vectorcraft.exe, LICENSE-MIT, LICENSE-APACHE, NOTICE, ASSETS.md dist/
          Compress-Archive -Path dist/* -DestinationPath VectorCraft-cutting-windows-x64.zip
      - name: Publish as the latest Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $short = "${{ github.sha }}".Substring(0, 9)
          # The previous build goes; a first run has none to delete.
          gh release delete windows-latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create windows-latest VectorCraft-cutting-windows-x64.zip `
            --target "${{ github.sha }}" --prerelease `
            --title "Windows build $short" `
            --notes "Unsigned Windows build of main at $short, made by the fork-windows-build workflow. Unzip and run vectorcraft.exe."
