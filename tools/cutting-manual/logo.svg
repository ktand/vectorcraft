<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Fork (cutting workspace): the cutting manual's mark. Original work for VectorCraft's cutting
       workspace, MIT OR Apache-2.0 (ASSETS.md). A mat with registration marks in its corners and a
       blade partway along a cut: behind it the line is cut, ahead of it still dashed. -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="#1d6f8a"/>
  <!-- Registration marks: the square at the top left, corners elsewhere. -->
  <rect x="20" y="20" width="11" height="11" rx="1.5" fill="#ffffff"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M97 21 H107 V31"/>
    <path d="M21 97 V107 H31"/>
  </g>
  <!-- The cut still to come. -->
  <path d="M65 64 C 80 64 80 38 104 38" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="4" stroke-linecap="round" stroke-dasharray="1 8"/>
  <!-- The cut made. -->
  <path d="M26 92 C 48 92 48 64 65 64" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <!-- The blade in its holder, its tip on the line. -->
  <g transform="rotate(-24 65 64)">
    <path d="M65 64 L59.5 50 H70.5 Z" fill="#ffffff"/>
    <rect x="57" y="22" width="16" height="30" rx="5" fill="#ffffff"/>
    <rect x="61" y="27" width="8" height="3.5" rx="1.75" fill="#1d6f8a"/>
  </g>
</svg>
